# 銘柄仕様（契約情報）
#
# 重要:
# - 本ファイルの値は 2026-09-27 時点で一次資料（取引所の契約仕様ページ）と照合できていない。
#   本環境から取引所サイトへの通信がネットワークポリシーで遮断されているため。
# - 値は作業者の既存知識に基づく「未確認値」であり、verification.status=unverified の市場は
#   本番接続の阻害条件（production blocker）になる（contracts.production_blockers() が列挙する）。
# - 契約仕様は取引所により変更される（例: 呼値、取引時間、限月サイクル）。本番前に必ず一次資料で確認し、
#   確認日と URL を verification に記録すること。
# - 手数料・証拠金・流動性はここに書かない（変動するため）。研究用仮定は assumptions.yaml に分離。
#
# ルールコード（contracts.py で実装）:
#   last_trade_rule / first_notice_rule の値は contracts.RULES のキー。null は該当なし。

defaults:
  min_trade_qty: 1
  roll:
    method: calendar            # calendar | volume（volume は前日までの出来高のみ使用）
    business_days_before: 5     # 基準日（first_notice か last_trade の早い方）の何営業日前に乗り換えるか
  verification:
    status: unverified
    source: "作業者の既存知識（一次資料未照合）"
    checked_on: null
    attempted_on: "2026-09-27"
    note: "取引所サイトへの通信が遮断されていたため未照合"

